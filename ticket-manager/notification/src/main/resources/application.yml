server:
  port: 8086

spring:
  application:
    name: customer
  rabbitmq:
    addresses: localhost:5672

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true



rabbitmq:
  exchanges:
    internal: internal.exchange
  email-queue:
    email: email.queue
  email-routing-keys:
    internal-email: internal.email.routing-key


email:
    sender:
      strategy: fakeEmailService