spring:
  datasource:
    url: jdbc:h2:mem:ai-agent-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  liquibase:
    change-log: classpath:liquibase-changelog.xml
    drop-first: true
  ai:
    mcp:
      client:
        enabled: false
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: test-model
          temperature: 0.0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/test

eureka:
  client:
    enabled: false

openapi:
  service:
    url: http://localhost:8099

ai-agent:
  persistence:
    mode: jpa
