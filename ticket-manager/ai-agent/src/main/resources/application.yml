server:
  port: 8099
spring:
  application:
    name: ai-agent
  ai:
    mcp:
      client:
        enabled: true
        request-timeout: 5s
        sse:
          connections:
            ai-tools-gateway:
              url: http://localhost:8105
              sse-endpoint: /sse
    ollama:
      base-url: http://127.0.0.1:7869
      chat:
        options:
          model: qwen3:8b
          temperature: 0.2
  zipkin:
    base-url: http://localhost:9411
  datasource:
    password: password
    url: jdbc:postgresql://localhost:51/ai-agent
    username: admin
  profiles:
    active: prod
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    defer-datasource-initialization: false
  sql:
    init:
      mode: always
  liquibase:
    change-log: classpath:liquibase-changelog.xml
    drop-first: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/ticket-manager-realm
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true
openapi:
  info:
    title: AI Agent Doc
    version: 1.0.0
  service:
    description: AI Agent APIs
    url: http://localhost:8099

ai-agent:
  answer:
    synthesizer: fake
  tools:
    allow-list:
      - tm.orders.search
    enforce-scopes: false
    metadata:
      "[tm.orders.search]":
        access-mode: READ
        required-scopes:
          - tools:orders.read



management:
  tracing:
    sampling:
      probability: 1.0
    enabled: true
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
