ai-agent:
  tools:
    enforce-scopes: false
    registry:
      "[tm.orders.search]":
        enabled: true
        source: INTERNAL_MCP
        access-mode: READ
        required-scopes:
          - tools:orders.read
        intents:
          - ORDER
        risk-level: LOW
        timeout: 3s
        max-response-size: 32KB
