ai-agent:
  tools:
    enforce-scopes: false
    registry:
      "[tm_my_orders_search]":
        enabled: true
        source: INTERNAL_MCP
        access-mode: READ
        required-scopes:
          - tools:orders.read
      "[tm_events_search]":
        enabled: true
        source: INTERNAL_MCP
        access-mode: READ
        required-scopes:
          - tools:events.read
