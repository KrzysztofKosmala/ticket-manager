server:
  port: 8105

spring:
  application:
    name: ai-tools-gateway
  ai:
    mcp:
      server:
        enabled: true
        name: company-gateway
        version: 1.0.0
        type: SYNC
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message
        capabilities:
          tool: true
        annotation-scanner:
          enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/ticket-manager-realm

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

openapi:
  info:
    title: AI Tools Gateway Doc
    version: 1.0.0
  service:
    description: AI Tools Gateway APIs
    url: http://localhost:8105

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true

ai-tools-gateway:
  tools:
    timeout-ms: 3000
    audit-enabled: true
